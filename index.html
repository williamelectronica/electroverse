  },

  /* ---------- Exportar e imprimir (siempre en tema claro, para ahorrar tinta) ---------- */
  conTemaClaro(fn) {
    const r = document.documentElement, antes = r.dataset.luz;
    r.dataset.luz = 'dia'; Lab.colorsDirty = true; Lab.updateLive();
    try { return fn(); } finally { if (antes === undefined) delete r.dataset.luz; else r.dataset.luz = antes; Lab.colorsDirty = true; Lab.updateLive(); }
  },
  svgTexto() {
    return this.conTemaClaro(() => {
      const svg = this.svg, cerca = svg.classList.contains('cerca'), lejos = svg.classList.contains('lejos');
      svg.classList.add('cerca'); svg.classList.remove('lejos', 'con-red');   // en el papel van todos los nombres de patas
      const clon = svg.cloneNode(true);
      svg.classList.toggle('cerca', cerca); svg.classList.toggle('lejos', lejos); svg.classList.toggle('con-red', !!this.redActiva && this.siguiendo);
      // Los estilos se calculan con las clases del momento de la copia

      const props = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'opacity', 'fill-opacity', 'stroke-opacity', 'font-family', 'font-size', 'font-weight', 'letter-spacing', 'text-anchor', 'display', 'visibility'];
      const orig = svg.querySelectorAll('*'), copia = clon.querySelectorAll('*');
      const sobran = [];   // zonas invisibles para el mouse: no van en el dibujo
      orig.forEach((el, i) => {
        if (el.classList.contains('hit') || el.classList.contains('hl') || el.classList.contains('hlbox')) { sobran.push(copia[i]); return; }
        const cs = getComputedStyle(el); copia[i].setAttribute('style', props.map(pp => pp + ':' + cs.getPropertyValue(pp)).join(';')); copia[i].removeAttribute('class');
      });
      sobran.forEach(n => n.remove());
      const over = clon.querySelector('#g-over'); if (over) over.remove();
      svg.classList.toggle('cerca', cerca); svg.classList.toggle('lejos', lejos); svg.classList.toggle('con-red', !!this.redActiva && this.siguiendo);
      clon.removeAttribute('class'); clon.removeAttribute('style');
      clon.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clon.setAttribute('viewBox', `0 0 ${W_BOARD} ${H_BOARD}`); clon.setAttribute('width', W_BOARD); clon.setAttribute('height', H_BOARD);
      clon.insertAdjacentHTML('afterbegin', `<rect x="0" y="0" width="${W_BOARD}" height="${H_BOARD}" fill="#ffffff"/>`);
      clon.insertAdjacentHTML('beforeend', `<text x="${W_BOARD - 12}" y="${H_BOARD - 10}" text-anchor="end" style="font:600 12px Arial;fill:#6d7898">${esc((Lab.title || 'Esquema') + ' · ELECTROVERSE')}</text>`);
      return new XMLSerializer().serializeToString(clon);
    });
  },
  nombreArchivo(ext) { return 'esquema-' + (Lab.title || 'circuito').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.' + ext; },
  descargar(blob, nombre) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); },
  exportarSVG() { this.descargar(new Blob([this.svgTexto()], { type: 'image/svg+xml' }), this.nombreArchivo('svg')); toast('Esquema guardado como SVG (vectorial: se ve nítido a cualquier tamaño).', 'ok'); },
  async exportarPNG(escala) {

      const cv = document.createElement('canvas'); cv.width = W_BOARD * escala; cv.height = H_BOARD * escala;

function arrowOn(x1, y1, x2, y2, t, rev) {

}

        if (mode === 'pinch' && pointers.size === 2) {

          const mx = (a.x + b.x) / 2 - start.mx, my = (a.y + b.y) / 2 - start.my, k = this.cam.r / 600;
          this.cam.tx = clamp(start.tx - (mx * Math.cos(this.cam.theta) + my * Math.sin(this.cam.theta)) * k, -12, 12);
          this.cam.tz = clamp(start.tz - (my * Math.cos(this.cam.theta) - mx * Math.sin(this.cam.theta)) * k, -8, 8);
        } else if (mode === 'pan') {
          const k = this.cam.r / 600;
          this.cam.tx = clamp(start.tx - (dx * Math.cos(this.cam.theta) + dy * Math.sin(this.cam.theta)) * k, -12, 12);
          this.cam.tz = clamp(start.tz - (dy * Math.cos(this.cam.theta) - dx * Math.sin(this.cam.theta)) * k, -8, 8);
        } else if (mode === 'rot') {
          this.cam.theta = start.th - dx * 0.008; this.cam.phi = clamp(start.ph - dy * 0.006, 0.05, 1.45);
        }
        if (moved) this.userMoved = true;
        this.request(); return;
      }
      if (Lab.tool !== 'sel' && e.pointerType !== 'touch') {
        const gp = this.gridAt(this.pick(e, canvas));
        this.hoverMarker.visible = !!gp; if (gp) this.hoverMarker.position.copy(this.P(gp, 0.03));

      } else if (this.hoverMarker.visible) { this.hoverMarker.visible = false; this.request(); }
    });
    const end = e => {
      const wasTap = start && !moved && mode !== 'pinch' && pointers.size === 1;
      pointers.delete(e.pointerId);
      if (pointers.size === 0) start = null;
      if (!wasTap || e.type === 'pointercancel') return;
      const rc = this.pick(e, canvas);
      if (Lab.tool === 'sel' || Lab.tool === 'probe') {
        const hits = rc.intersectObjects(this.parts.children, true).filter(h => !h.object.isSprite);
        let o = hits.length ? hits[0].object : null;
        while (o && !o.userData.id && o.parent) o = o.parent;
        if (o && o.userData.id) { Lab.onPart(o.userData.id); return; }
        if (Lab.tool === 'sel') { Lab.selected = null; Lab.renderBoard(); Lab.renderSide(); return; }
      }
      const gp = this.gridAt(rc); if (gp) Lab.onPoint(gp[0], gp[1]);
    };
    canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('wheel', e => { e.preventDefault(); this.userMoved = true; this.cam.r = clamp(this.cam.r * (e.deltaY > 0 ? 1.1 : 0.9), 8, 48); this.request(); }, { passive: false });

      e.preventDefault(); e.stopPropagation(); this.request();

};

/* ===== Módulos y sensores reales para la protoboard: dibujo fiel, pines, comportamiento eléctrico y conexión con el programa ===== */
/* Cada módulo se coloca en la mesa (debajo de la protoboard) y se conecta con cables desde sus pines.
   Los sensores analógicos y digitales entregan un voltaje real al circuito; los módulos de librería (LCD, OLED, servo, DHT…)
   solo responden si están alimentados y si sus pines de señal llegan al pin del microcontrolador que usa el programa. */
const MOD_P = 16;
const mm = v => v * MOD_P; // unidades de hueco (2,54 mm) a píxeles del dibujo
const MODX = {
  t: (x, y, s, size = 7, fill = '#fff', anchor = 'middle', w = 700) => `<text x="${x}" y="${y}" font-family="monospace" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}">${s}</text>`,
  pcb: (w, h, color, r = 4) => `<rect x="0" y="0" width="${mm(w)}" height="${mm(h)}" rx="${r}" fill="${color}" stroke="#0006" stroke-width="1"/><rect x="2" y="2" width="${mm(w) - 4}" height="${mm(h) - 4}" rx="${r - 1}" fill="none" stroke="#ffffff22"/>`,
  hole: (x, y, r = 3.2) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#d9c27a"/><circle cx="${x}" cy="${y}" r="${r * 0.55}" fill="#111"/>`,
  led: (x, y, on, col = '#ff3b2f', off = '#5a2020') => `<rect x="${x - 3}" y="${y - 2}" width="6" height="4" rx="1" fill="${on ? col : off}"${on ? ` style="filter:drop-shadow(0 0 3px ${col})"` : ''}/>`,
  smd: (x, y, w = 6, h = 3, c = '#2a2a2a') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/><rect x="${x}" y="${y}" width="1.4" height="${h}" fill="#c9cdd4"/><rect x="${x + w - 1.4}" y="${y}" width="1.4" height="${h}" fill="#c9cdd4"/>`,
  trim: (x, y) => `<rect x="${x - 6}" y="${y - 6}" width="12" height="12" rx="1.5" fill="#1f5fd1"/><circle cx="${x}" cy="${y}" r="4" fill="#e9eef7"/><path d="M${x - 2.6} ${y - 2.6}L${x + 2.6} ${y + 2.6}" stroke="#555" stroke-width="1.4"/>`,
  ic8: (x, y, label) => `<rect x="${x}" y="${y}" width="22" height="14" rx="1" fill="#1b1c20"/>${[0, 1, 2, 3].map(i => `<rect x="${x + 2 + i * 5.4}" y="${y - 2}" width="2" height="2" fill="#c9cdd4"/><rect x="${x + 2 + i * 5.4}" y="${y + 14}" width="2" height="2" fill="#c9cdd4"/>`).join('')}<text x="${x + 11}" y="${y + 9}" font-family="monospace" font-size="4.2" fill="#aab" text-anchor="middle">${label}</text>`
};
/* pines del cabezal: dorados con rótulo serigrafiado */
function modHeader(def) {
  return def.pins.map(q => {
    const x = mm(q.x), y = mm(q.y), lp = q.lp || 'u', off = 9;
    const tx = lp === 'l' ? x - off : lp === 'r' ? x + off : x, ty = lp === 'u' ? y - off : lp === 'd' ? y + off + 3 : y + 2.4;
    const anc = lp === 'l' ? 'end' : lp === 'r' ? 'start' : 'middle';
    return `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" rx="1" fill="#141518"/><rect x="${x - 2.3}" y="${y - 2.3}" width="4.6" height="4.6" fill="#e1c35a"/>` + MODX.t(tx, ty, q.label, 5.6, def.silk || '#fff', anc);
  }).join('');
}
const CABLE = { GND: '#4a2c1a', VCC: '#d32f2f', SIG: '#f39c12' };

/* fábrica de módulos de sensor con comparador LM393 (AO + DO) */
function lm393Board(o) {
  return Object.assign({
    cat: 'sensores', w: 12.6, h: 5.6, color: '#1b4fb8', load: 900, vmin: 3,
    pins: [['VCC', 0.8, 1.3, 'pwr', 'VCC', 'r'], ['GND', 0.8, 2.3, 'gnd', 'GND', 'r'], ['DO', 0.8, 3.3, 'out', 'DO', 'r'], ['AO', 0.8, 4.3, 'out', 'AO', 'r']],
    d: Object.assign({ thr: 50 }, o.d),
    draw(p, st) {
      const W = mm(this.w), H = mm(this.h), act = st.doActive;
      return MODX.pcb(this.w, this.h, this.color) + MODX.hole(W - 6, 6) + MODX.hole(W - 6, H - 6) + MODX.ic8(mm(4.2), mm(1.0), 'LM393') + MODX.trim(mm(5.4), mm(4.2)) +
        MODX.smd(mm(7.2), mm(3.6)) + MODX.smd(mm(7.2), mm(4.4)) + MODX.led(mm(7.4), mm(1.2), st.pw, '#ff3b2f') + MODX.t(mm(8.3), mm(1.4), 'PWR', 4, '#fff', 'start') +
        MODX.led(mm(7.4), mm(2.2), st.pw && act, '#2bff6a', '#1d4a2a') + MODX.t(mm(8.3), mm(2.4), 'D0', 4, '#fff', 'start') + o.sensor(p, st, W, H) + modHeader(this);
    },
    props: [{ key: 'val', label: o.label, min: o.min, max: o.max, step: o.step || 1, unit: o.unit }, { key: 'thr', label: 'Umbral del comparador (potenciómetro azul)', min: 0, max: 100, step: 1, unit: '%' }],
    frac(p) { return clamp(ANALOG_SENSORS[o.sk].v(+p.val, 1), 0, 1); },
    trig(p) { return this.frac(p) * 100 >= +p.thr === !o.lowFrac; },
    net(p, N) {
      if (!N.powered()) return;
      N.load(this.load);
      if (N.wired('AO')) N.ctlV('AO', 200, V => this.frac(p) * N.vcc(V));
      if (N.wired('DO')) N.ctlV('DO', 1000, V => (this.trig(p) ? 0 : N.vcc(V))); // salida activa en bajo
    },
    live(p, V) { return { doActive: this.trig(p) }; }
  }, o);
}
function digital3(o) { // módulos de 3 pines con salida digital
  return Object.assign({
    cat: 'sensores', load: 1500, vmin: 3, d: { on: false },
    props: [{ key: 'on', toggle: true, label: o.label, on: o.onTxt, off: o.offTxt }],
    net(p, N) {
      if (!N.powered()) return; N.load(this.load);
      const outPin = this.pins.find(q => q.kind === 'out').id;
      if (N.wired(outPin)) N.ctlV(outPin, o.rout || 1000, V => { const vc = N.vcc(V), hi = o.vhigh ? Math.min(o.vhigh, vc) : vc; return o.activeHigh ? (p.on ? hi : 0) : (p.on ? 0 : vc); });
    },
    live(p) { return { doActive: !!p.on }; }
  }, o);
}

  /* aristas por donde circula corriente dentro de un mismo nodo: cables y uniones internas de pulsadores y displays */
  const flowEdges = [];
  parts.forEach(p => {
    if (p.k === 'WIRE') flowEdges.push({ id: p.id, a: hGroup(p.pins[0]), b: hGroup(p.pins[1]) });

}

/* ---------- Dibujo realista (vista superior) ---------- */
const PBD = {

      case 'BUZ': { const G = PBD.geom(A, B), r = 0.95 * P; g = PBD.leg(A, B) + `<g transform="translate(${G.mx} ${G.my})"><circle r="${r}" fill="#18191c"/><circle r="${r * 0.82}" fill="none" stroke="#2a2c31" stroke-width="2"/><circle class="pb-buz" r="${r * 0.2}" fill="#333"/><text class="pb-tiny" x="${-r * 0.55}" y="${-r * 0.35}" fill="#ddd">+</text></g>`; break; }

      const yT = top[0][1], yB = bot[0][1], bx0 = x0 - 0.45 * P, bx1 = x1 + 0.45 * P, by0 = yT + 0.38 * P, by1 = yB - 0.38 * P;

};

/* ---------- Estado del laboratorio de protoboard ---------- */
const PB_EX = {};
const Proto = {
  parts: [], boards: 1, tool: 'sel', pending: null, rot: 0, hover: null, selected: null, probes: {}, sim: null, net: null, res: null,
  running: true, raf: 0, samples: [], tdiv: 0.2, events: [], wireColor: 'auto', view: '3d', zoom: 1, hist: [], fut: [], labels: true, lastSlot: 0,
  occupied() { const m = {}; this.parts.forEach(p => p.pins.forEach(h => { m[h] = p.id; })); return m; },
  nextId(k) { const pre = PB_PREFIX[k] || (IC_DEFS[k] ? 'U' : 'X'); const used = new Set(this.parts.map(p => p.id)); let n = 1; while (used.has(pre + n)) n++; return pre + n; },
  snapshot() { return JSON.stringify({ b: this.boards, p: this.parts }); },
  restore(s) { const o = JSON.parse(s); if (Array.isArray(o)) { this.parts = o; } else { this.parts = o.p; this.boards = o.b || 1; } },
  commit(before) { this.hist.push(before); if (this.hist.length > 120) this.hist.shift(); this.fut = []; this.persist(); },
  undo() { if (!this.hist.length) return; this.fut.push(this.snapshot()); this.restore(this.hist.pop()); this.selected = null; this.changed(); },
  redo() { if (!this.fut.length) return; this.hist.push(this.snapshot()); this.restore(this.fut.pop()); this.selected = null; this.changed(); },
  persist() { Store.lset('proto', { boards: this.boards, code: this.code, parts: this.parts.map(p => { const q = Object.assign({}, p); delete q.autoColor; return q; }), probes: this.probes }); },
  load(ex) {

    if (this.mcuStop) this.mcuStop(true); if (e.code) this.code = typeof e.code === 'function' ? e.code() : e.code; this.boards = e.boards || 1; this.parts = JSON.parse(JSON.stringify(e.parts)); this.probes = JSON.parse(JSON.stringify(e.probes || {}));
    this.title = e.name; this.note = e.note; this.selected = null; this.hist = []; this.fut = []; this.samples = [];
    if (window.Proto3D) Proto3D.needFit = true;
    this.assignSlots(); this.changed(); this.persist();
  },
  assignSlots() { let i = 0; this.parts.forEach(p => { if (PB_BY_K[p.k].place === 'off') { if (!p.slot) p.slot = [62, 70 + i * 112]; i++; } }); },

      <rect x="${x0 + 10.1 * P}" y="${y0 + 19.4 * P}" width="${8.0 * P}" height="${1.2 * P}" fill="#15171b"/><rect x="${x0 + 19.1 * P}" y="${y0 + 19.4 * P}" width="${6.0 * P}" height="${1.2 * P}" fill="#15171b"/>

      <text class="mcu-title" x="${x0 + 9 * P}" y="${y0 + 7.4 * P}">UNO</text><text class="mcu-sub" x="${x0 + 9.1 * P}" y="${y0 + 8.6 * P}">ARDUINO</text>

      <circle class="mcu-pwr on" cx="${x0 + 24 * P}" cy="${y0 + 6 * P}" r="3"/><text class="mcu-sub" x="${x0 + 24.6 * P}" y="${y0 + 6.3 * P}">ON</text>`;

    const uno = d.board === 'uno';
    body = `<rect x="${x0}" y="${y0}" width="${W}" height="${H}" rx="5" fill="${d.color}"/>
      <rect x="${x0 - 8}" y="${y0 + H / 2 - 1.2 * P}" width="${2.4 * P}" height="${2.4 * P}" rx="2" fill="#c3c8d0"/>
      ${uno ? `<rect x="${x0 + 6.5 * P}" y="${y0 + 2 * P}" width="${3 * P}" height="${3 * P}" rx="2" transform="rotate(45 ${x0 + 8 * P} ${y0 + 3.5 * P})" fill="#16171b"/>`
        : `<rect x="${x0 + 13 * P}" y="${y0 + 2.4 * P}" width="${8 * P}" height="${6.2 * P}" rx="2" fill="#b8bec8"/><text class="mcu-chip" x="${x0 + 17 * P}" y="${y0 + 5.8 * P}" text-anchor="middle" fill="#333">ESP32-WROOM</text>`}
      <text class="mcu-title" x="${x0 + (uno ? 11.5 : 3.2) * P}" y="${y0 + H / 2 + 5}" style="font-size:13px">${esc(d.short || d.name)}</text>

  } else {

      <path d="M${x0 + 19.6 * P} ${y0 + 3 * P}h${P}v${P}h${-P}" stroke="#d6a400" fill="none" stroke-width="1.6"/>
      <text class="mcu-title" x="${x0 + 3.2 * P}" y="${y0 + 6.2 * P}" style="font-size:13px">ESP32</text>

}

  oledImg(id, st) {

  },
  modKey(p, st) { return JSON.stringify([st.pw, st.ok, st.why, st.doActive, st.relayOn, st.amps !== undefined ? Math.round(st.amps * 100) : 0, st.card, st.oled ? st.oled.length + st.oled.slice(-24) : '', st.dev && st.dev.state, p]); },
  modRefresh() {
    if (!Object.keys(PB_MODS).length) return;

      if (k !== old && layer) { const g = layer.querySelector(`[data-id="${CSS.escape(p.id)}"]`); if (g) { const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'g'); this.modSt[p.id] = st[p.id]; tmp.innerHTML = modSVG(p); const n = tmp.firstElementChild; if (this.selected === p.id) n.classList.add('sel'); g.replaceWith(n); } }

    if (this.sound && bz && st[bz.id].dev && st[bz.id].dev.state) { Ard.sound = true; Ard.toneUpdate(st[bz.id].dev.state); } else if (window.Ard) Ard.toneOff();
    return changed;
  },
  modChecks(items) { Object.values(PB_MODS).forEach(p => { const s = this.modSt[p.id]; if (s && s.why) items.push({ kind: 'warn', text: p.id + ' (' + MOD_DEFS[p.k].short + '): ' + s.why }); }); },
  /* colocar un módulo en la mesa (u, v en unidades de hueco) */
  modFits(k, at, skipId) {
    const D = MOD_DEFS[k], r = [at[0] - 1, at[1] - 1, at[0] + D.w + 1, at[1] + D.h + 1];
    const hit = (a) => !(a[2] <= r[0] || a[0] >= r[2] || a[3] <= r[1] || a[1] >= r[3]);
    if (PB_MCU_K) { const m = MCU_DEFS[PB_MCU_K]; if (hit([PB_MCU_AT[0] - 1.5, PB_MCU_AT[1], PB_MCU_AT[0] + m.w, PB_MCU_AT[1] + m.h])) return false; }
    return !Object.values(PB_MODS).some(p => p.id !== skipId && hit([p.at[0], p.at[1], p.at[0] + MOD_DEFS[p.k].w, p.at[1] + MOD_DEFS[p.k].h]));
  },
  modAt(k, u, v) { const D = MOD_DEFS[k]; return [clamp(Math.round(u - D.w / 2), -7, Math.round(64 - D.w)), Math.max(0, Math.round(v - mcuY0() - D.h / 2))]; },
  placeMod(k, u, v) {
    if (v < mcuY0() - 1) { toast('Los módulos van en la mesa, debajo de la protoboard. Toca el espacio libre de abajo.', 'warn', 3500); return; }
    const at = this.modAt(k, u, v);
    if (!this.modFits(k, at)) { toast('No cabe ahí: se cruza con la placa o con otro módulo. Elige un espacio libre de la mesa.', 'warn', 3500); return; }
    const before = this.snapshot(), id = this.nextId(k);

  freeSpot(k) {

  moveMod(p, at) { if (!this.modFits(p.k, at, p.id)) return false; p.at = at; return true; }
  ,
  modProps(p) {
    const D = MOD_DEFS[p.k], st = this.modSt[p.id] || {}, R = this.mcuRT;

        : `<div class="msg"><i>·</i><span>${D.lib ? (R.on ? 'Esperando que el programa use este módulo (revisa la librería y los pines).' : 'Conéctalo y ejecuta un programa que lo use.') : (D.pins.some(q => q.kind === 'pwr') ? 'Conecta VCC y GND para encenderlo.' : 'Conecta sus terminales con cables.')}</span></div>`;
    const fields = (D.props || []).map(pr => pr.toggle ? `<button class="btn sm" data-mtog="${pr.key}">${esc(pr.label)}: <b>${esc(p[pr.key] ? pr.on : pr.off)}</b></button>`
      : `<div class="field"><label for="pbm-${pr.key}">${esc(pr.label)}: <span class="mono" id="pbm-${pr.key}-v">${p[pr.key]} ${pr.unit}</span></label><input type="range" id="pbm-${pr.key}" data-mr="${pr.key}" min="${pr.min}" max="${pr.max}" step="${pr.step || 1}" value="${p[pr.key]}"></div>`).join('');
    let extra = '';
    if (p.k === 'RFID') extra = `<div class="row">${RFID_CARDS.map(([n], i) => `<button class="btn sm" data-card="${i}">${ic('spark')} Acercar tarjeta ${esc(n)}</button>`).join('')}</div>` + (st.dev && st.dev.state && st.dev.state.ultima ? `<p class="small mono">Última leída: ${esc(st.dev.state.ultima)}</p>` : '');
    if (p.k === 'BZP') extra = `<button class="btn sm" data-snd="1">${this.sound ? 'Silenciar' : 'Activar sonido'}</button>`;
    if (p.k === 'KEY') extra = '<p class="small muted">Mantén presionado el botón del módulo en la vista superior.</p>';
    const gnd = D.pins.find(q => q.kind === 'gnd'), g0 = gnd && this.res ? this.holeV(p.id + ':' + gnd.id) : null;
    const pins = `<div class="table-wrap"><table class="t pinv"><tr><th>Pin</th><th>Función</th><th>Voltaje</th></tr>${D.pins.map(q => { const v = this.res ? this.holeV(p.id + ':' + q.id) : null; const fn = { pwr: 'alimentación', gnd: 'tierra', i2c: 'bus I2C', sig: 'señal', out: 'salida', in: 'entrada', term: 'terminal', nc: 'sin uso' }[q.kind]; return `<tr><td class="mono">${esc(q.label)}</td><td>${fn}</td><td class="mono">${v === null ? '—' : fmt(v - (g0 || 0), 'V')}</td></tr>`; }).join('')}</table></div>`;
    return status + fields + extra + pins;
  },
  bindModProps(p, el) {
    $$('[data-mr]', el).forEach(inp => {
      const pr = MOD_DEFS[p.k].props.find(x => x.key === inp.dataset.mr);
      inp.oninput = () => { p[pr.key] = +inp.value; const lv = $('#pbm-' + pr.key + '-v'); if (lv) lv.textContent = inp.value + ' ' + pr.unit; this.modTick(); this.live(); this.renderMeter(); this.modRefresh(); this.mcuSendInputs(); };

    });
    $$('[data-mtog]', el).forEach(b => b.onclick = () => this.set(p, b.dataset.mtog, !p[b.dataset.mtog], true));
    $$('[data-card]', el).forEach(b => b.onclick = () => {
      if (!this.mcuRT.worker) { toast('Primero ejecuta el programa.', 'warn'); return; }
      const st = this.modSt[p.id]; if (!st || !st.ok) { toast('El lector no responde: ' + ((st && st.why) || 'revisa sus conexiones y que el programa use MFRC522.'), 'warn', 4000); return; }
      this.mcuRT.worker.postMessage({ type: 'card', uid: RFID_CARDS[+b.dataset.card][1] }); toast('Tarjeta ' + RFID_CARDS[+b.dataset.card][0] + ' acercada al lector.', '', 1800);
    });
    $$('[data-snd]', el).forEach(b => b.onclick = () => { this.sound = !this.sound; if (!this.sound) Ard.toneOff(); b.textContent = this.sound ? 'Silenciar' : 'Activar sonido'; });
  }
});

function highlight(code) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(#\w+)|\b(\d+\.?\d*)\b|\b(void|int|long|float|double|byte|bool|boolean|char|String|unsigned|word)\b|\b(if|else|for|while|do|return|break|continue|switch|case|default|const|true|false|HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|LED_BUILTIN|A[0-7]|WL_CONNECTED)\b|\b([A-Za-z_]\w*)(?=\s*\()/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = esc(m[0]);
    out += m[1] ? '<span class="tk-c">' + t + '</span>' : m[2] ? '<span class="tk-s">' + t + '</span>' : m[3] ? '<span class="tk-p">' + t + '</span>' : m[4] ? '<span class="tk-n">' + t + '</span>' : m[5] ? '<span class="tk-t">' + t + '</span>' : m[6] ? '<span class="tk-k">' + t + '</span>' : '<span class="tk-f">' + t + '</span>';
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last)) + '\n';
}

const Ard = {
  worker: null, status: 'detenido', levels: {}, modes: {}, serial: [], plot: [], showPlot: false, errors: [], warns: [],
  board: 'uno', btn: 0, cfg: null, devs: {}, wifi: null, lastMsg: 0, watchdog: 0, code: null, example: 'blink', partial: '',
  workerUrl: null, audio: null, osc: null, sound: false, envNeeded: new Set(), renderQ: 0, real: null,

  /* ----- configuración de entradas (se guarda por placa) ----- */
  loadCfg() {
    if (this.cfg) return;
    const saved = Store.lget('ardcfg', null) || {};
    this.cfg = { env: Object.assign(Object.fromEntries(Object.entries(ENV).map(([k, e]) => [k, e.def])), saved.env || {}) };
    ['uno', 'esp32'].forEach(b => {
      const s = (saved[b] || {}), a = s.a || {};
      if (!s.a) Object.entries(BOARD_INFO[b].defA).forEach(([pin, type]) => { a[pin] = { type, val: ANALOG_SENSORS[type].def }; });
      this.cfg[b] = { a, d: s.d || {} };
    });
  },
  saveCfg: debounce(function () { Store.lset('ardcfg', Ard.cfg); }, 500),
  inputs() {
    const info = BOARD_INFO[this.board], c = this.cfg[this.board];
    const a = {}, d = {};
    Object.entries(c.a).forEach(([pin, s]) => { const S = ANALOG_SENSORS[s.type]; if (S) a[pin] = clamp(S.v(+s.val, info.vref), 0, info.vref); });
    Object.entries(c.d).forEach(([pin, s]) => { const S = DIGITAL_SENSORS[s.type]; if (S) d[pin] = s.on ? S.active : 1 - S.active; });
    return { btn: this.btn, btnPin: info.btnPin, a, d, env: Object.assign({}, this.cfg.env) };
  },
  sendInputs() { if (this.worker) this.worker.postMessage({ type: 'input', inputs: this.inputs() }); },

  getWorkerUrl() {
    if (!this.workerUrl) { const src = $('#ard-worker-src').textContent; this.workerUrl = URL.createObjectURL(new Blob([src], { type: 'text/javascript' })); }
    return this.workerUrl;
  },
  run() {
    if (this.real && this.real.port) { toast('Desconecta la placa real antes de ejecutar la simulación.', 'warn'); return; }
    this.stop(true);
    const code = $('#code').value; this.code = code; this.persist();
    const c = EVEngine.compileArduino(code);
    this.errors = c.ok ? [] : c.errors; this.warns = [];
    this.renderErrors();
    if (!c.ok) { this.setStatus('error'); this.log('e', 'Compilación fallida: ' + c.errors.length + ' error(es).'); return; }
    this.log('s', 'Compilado para ' + BOARD_INFO[this.board].name + '. Subiendo a la placa simulada…');
    try { this.worker = new Worker(this.getWorkerUrl()); }
    catch (e) { this.setStatus('error'); this.log('e', 'Este navegador no permite ejecutar el simulador en segundo plano: ' + e.message); return; }
    this.levels = {}; this.modes = {}; this.devs = {}; this.wifi = null; Iot.subs.clear(); Iot.connected = false;
    this.scanEnv(code); this.renderMods(); this.renderLeds(); this.renderInputs(); this.renderBoardStatus(); Iot.render();
    this.worker.onmessage = ev => this.onMsg(ev.data);
    this.worker.onerror = ev => { ev.preventDefault(); this.log('e', 'Error: ' + EVEngine.traducirError(ev.message || '')); this.setStatus('error'); };
    this.worker.postMessage({ type: 'start', js: c.js, board: this.board, inputs: this.inputs() });
    this.setStatus('ejecutando'); this.lastMsg = performance.now();
    clearInterval(this.watchdog);
    this.watchdog = setInterval(() => {
      if (this.status === 'ejecutando' && performance.now() - this.lastMsg > 4000) { this.log('w', 'La placa no responde desde hace 4 s. Si hay un bucle sin salida, pulsa Detener.'); this.lastMsg = performance.now(); }
    }, 1000);
    if (!State.profile.badges.includes('programador')) { award('programador'); addXP(15, 'Primer programa'); }
    if (this.board === 'esp32' && !State.profile.badges.includes('iot') && /PubSubClient/.test(code)) { award('iot'); addXP(20, 'Primer proyecto IoT'); }
  },
  stop(silent) {
    if (this.worker) { this.worker.terminate(); this.worker = null; }
    clearInterval(this.watchdog); this.toneOff();
    if (!silent) { this.setStatus('detenido'); this.log('s', 'Programa detenido.'); }
    this.levels = {}; this.wifi = null; Iot.connected = false;
    this.renderLeds(); this.renderBoardStatus(); this.renderModsLive(); Iot.render();
  },
  scanEnv(code) {
    this.envNeeded = new Set();
    Object.entries(ENV_BY_CLASS).forEach(([cls, keys]) => { if (new RegExp('\\b' + cls + '\\s+\\w+').test(code)) keys.forEach(k => this.envNeeded.add(k)); });
    if (/\bpulseIn\s*\(/.test(code)) this.envNeeded.add('dist');
  },
  onMsg(d) {
    this.lastMsg = performance.now();
    switch (d.type) {
      case 'state':
        Object.assign(this.levels, d.pins); if (d.modes) this.modes = d.modes;
        if (d.serial) this.addSerial(d.serial);
        if (d.devs) Object.entries(d.devs).forEach(([id, st]) => { if (id === 'buzzer') { this.devs.buzzer = { cls: 'Buzzer', state: st }; this.toneUpdate(st); } else if (this.devs[id]) this.devs[id].state = st; });

      case 'dev':

        (ENV_BY_CLASS[d.cls] || []).forEach(k => this.envNeeded.add(k));

        break;
      case 'pin': if (d.kind !== 'pulse') this.addInputPin(d.pin, d.kind); break;
      case 'wifi': this.wifi = d; this.renderBoardStatus(); if (d.st === 'conectado') this.log('s', 'Wi-Fi conectado a “' + d.ssid + '” · IP ' + d.ip); break;
      case 'mqttConn': Iot.connected = true; Iot.server = d.server; Iot.render(); break;
      case 'mqttSub': Iot.subs.add(d.topic); Iot.render(); break;

      case 'warn': this.warns.push(d.msg); this.log('w', '⚠ ' + d.msg); break;
      case 'error': this.setStatus('error'); this.log('e', 'Error durante la ejecución: ' + d.msg); this.errors = [{ line: 0, msg: d.msg }]; this.renderErrors(); break;
    }
  },
  queueRender() {
    if (this.renderQ) return;
    this.renderQ = requestAnimationFrame(() => { this.renderQ = 0; this.renderLeds(); this.renderModsLive(); });
  },
  addInputPin(pin, kind) {
    const c = this.cfg[this.board];
    if (kind === 'a' && !c.a[pin]) { c.a[pin] = { type: 'pot', val: 50 }; }

      <div class="row"><label class="sr" for="add-a">Pin</label><select class="input sm" id="add-a" style="width:auto">${pinOpts(-1)}</select><button class="btn sm" id="add-a-btn">${ic('plus')} Sensor analógico</button></div>

      const upd = () => { const S = ANALOG_SENSORS[s.type], v = clamp(S.v(+s.val, info.vref), 0, info.vref), raw = Math.round(v / info.vref * ((1 << info.bits) - 1)); txt.textContent = (+s.val).toLocaleString('es-PE') + ' ' + S.unit + ' → ' + v.toFixed(2).replace('.', ',') + ' V · ' + raw; };

      $('[data-k="type"]', row).onchange = e => { s.type = e.target.value; s.val = ANALOG_SENSORS[s.type].def; this.saveCfg(); this.renderInputs(); this.sendInputs(); };

  renderMods() {

  renderModsLive() {

    Object.entries(this.devs).forEach(([id, d]) => {

  renderSerial() {

  gotoLine(n) {

  renderGutter() {

  drawPlot() {
    const cv = $('#plot'); if (!cv) return;

    cv.width = w * dpr; cv.height = h * dpr; const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cs = getComputedStyle(document.documentElement), col = v => cs.getPropertyValue(v).trim();
    ctx.clearRect(0, 0, w, h);
    const P = this.plot; if (!P.length) { ctx.fillStyle = col('--muted'); ctx.font = '12px sans-serif'; ctx.fillText('Imprime números con Serial.println() para graficarlos.', 10, h / 2); return; }
    let mn = Infinity, mx = -Infinity; P.forEach(r => r.forEach(v => { mn = Math.min(mn, v); mx = Math.max(mx, v); }));
    if (mx - mn < 1e-9) { mx += 1; mn -= 1; }
    const pad = (mx - mn) * 0.1; mn -= pad; mx += pad;
    ctx.strokeStyle = col('--line'); for (let j = 0; j <= 4; j++) { const y = j * h / 4 + .5; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ['--amber', '--cyan', '--magenta'].forEach((c, k) => {
      ctx.strokeStyle = col(c); ctx.lineWidth = 2; ctx.beginPath(); let st = false;
      P.forEach((r, i) => { if (r[k] === undefined) return; const x = i / 299 * w, y = h - (r[k] - mn) / (mx - mn) * h; st ? ctx.lineTo(x, y) : ctx.moveTo(x, y); st = true; });
      ctx.stroke();
    });
    ctx.fillStyle = col('--muted'); ctx.font = '11px ' + col('--f-mono');
    ctx.fillText(mx.toFixed(1), 6, 12); ctx.fillText(mn.toFixed(1), 6, h - 4);
  }
};

/* Dibuja la OLED con píxeles nítidos: el texto se rasteriza y se umbraliza a 1 bit */
function drawOled(cv, st) {
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 128, 64);

    ctx.fillStyle = ctx.strokeStyle = col ? '#fff' : '#000';
    if (o[0] === 't') { ctx.font = (8 * o[3]) + 'px "JetBrains Mono", monospace'; ctx.fillText(o[5], o[1], o[2] + 0.5 * o[3]); }
    else if (o[0] === 'p') ctx.fillRect(o[1], o[2], 1, 1);
    else if (o[0] === 'l') { ctx.beginPath(); ctx.moveTo(o[1] + .5, o[2] + .5); ctx.lineTo(o[3] + .5, o[4] + .5); ctx.stroke(); }
    else if (o[0] === 'r') { if (o[6]) ctx.fillRect(o[1], o[2], o[3], o[4]); else ctx.strokeRect(o[1] + .5, o[2] + .5, o[3] - 1, o[4] - 1); }

  ctx.putImageData(img, 0, 0);
}

/* ---------- Broker MQTT y panel IoT ---------- */
const Iot = {
  topics: {}, order: [], subs: new Set(), log: [], connected: false, server: '', shared: false, room: null, unsub: null, rq: 0,
  publish(topic, payload, origin) {
    topic = String(topic).slice(0, 120); payload = String(payload).slice(0, 500);
    if (!/^[^#+\s][^#+]*$/.test(topic)) return;
    const t = this.topics[topic] || (this.topics[topic] = { hist: [] });
    if (!this.order.includes(topic)) this.order.push(topic);
    t.v = payload; t.ts = Date.now(); t.from = origin;
    const n = parseFloat(payload); if (isFinite(n) && /^\s*-?\d/.test(payload)) { t.hist.push(n); if (t.hist.length > 60) t.hist.shift(); }
    this.log.unshift({ topic, payload, origin, ts: t.ts }); this.log = this.log.slice(0, 40);
    if (Ard.worker && this.connected) Ard.worker.postMessage({ type: 'mqttIn', topic, payload });
    if (this.shared && this.room && origin !== 'clase') this.room.emit('mqtt', { t: topic, p: payload }).catch(e => { if (e && e.code === 'not_permitted') { this.shared = false; toast('Tu acceso a esta plataforma no permite enviar al broker de la clase.', 'warn'); this.render(); } });
    this.render();
  },
  async share(on) {
    if (!on) { this.shared = false; if (this.unsub) { this.unsub(); this.unsub = null; } this.render(); return; }
    try {
      this.room = this.room || (window.claude && await claude.use('room'));
      if (!this.room) { toast('El broker de la clase solo funciona dentro del enlace de Claude.', 'warn'); this.render(); return; }
      this.unsub = this.room.on('mqtt', msg => {
        if (msg.isMe && msg.sameTab) return;
        const d = msg.data || {};
        if (typeof d.t !== 'string' || typeof d.p !== 'string') return;
        this.publish(d.t, d.p, 'clase');
      });
      this.shared = true; toast('Conectado al broker de la clase: verás en vivo lo que publiquen tus compañeros.', 'ok');
    } catch (e) { toast('No se pudo conectar al broker de la clase.', 'warn'); }
    this.render();
  },
  render() {
    if (this.rq) return;
    this.rq = requestAnimationFrame(() => { this.rq = 0; this.draw(); });
  },
  draw() {
    const box = $('#iot'); if (!box) return;
    const st = $('#iot-status');
    if (st) { st.className = 'chip ' + (this.connected ? 'ok' : ''); st.innerHTML = '<span class="dot"></span>' + (this.connected ? 'Placa conectada a ' + esc(this.server) : 'Placa sin conexión MQTT'); }
    const sh = $('#iot-share'); if (sh) sh.checked = this.shared;
    const cards = this.order.slice(-12).map(topic => {
      const t = this.topics[topic], sub = Array.from(this.subs).some(f => mqttMatchUI(f, topic));
      return `<div class="iot-card"><div class="row" style="justify-content:space-between;gap:6px"><span class="mono small topic">${esc(topic)}</span>${sub ? '<span class="badge vio">placa suscrita</span>' : ''}</div>
        <div class="iot-v">${esc(t.v)}</div>${t.hist.length > 1 ? sparkline(t.hist) : ''}
        <div class="small muted">${t.from === 'placa' ? 'de tu placa' : t.from === 'clase' ? 'de la clase' : 'desde el panel'} · ${new Date(t.ts).toLocaleTimeString('es-PE')}</div></div>`;
    }).join('');
    const subsBtns = Array.from(this.subs).filter(f => !/[#+]/.test(f)).map(f => `<div class="row" style="gap:6px"><span class="mono small" style="min-width:90px">${esc(f)}</span><button class="btn sm go" data-pub="${esc(f)}|ON">ON</button><button class="btn sm" data-pub="${esc(f)}|OFF">OFF</button></div>`).join('');
    box.innerHTML = `${subsBtns ? `<div class="lbl">Controlar la placa</div>${subsBtns}` : ''}
      <div class="iot-grid">${cards || '<p class="small muted">Aún no hay mensajes. Ejecuta “ESP32 · IoT: temperatura y luz por MQTT”.</p>'}</div>`;
    $$('[data-pub]', box).forEach(b => b.onclick = () => { const [t, p] = b.dataset.pub.split('|'); this.publish(t, p, 'panel'); });
  }
};
function mqttMatchUI(filter, topic) { const f = filter.split('/'), t = topic.split('/'); for (let i = 0; i < f.length; i++) { if (f[i] === '#') return true; if (i >= t.length || (f[i] !== '+' && f[i] !== t[i])) return false; } return f.length === t.length; }
function sparkline(h) {
  const w = 160, H = 34, mn = Math.min(...h), mx = Math.max(...h), r = mx - mn || 1;
  const pts = h.map((v, i) => [i / (h.length - 1) * w, H - 3 - (v - mn) / r * (H - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${w} ${H}L0 ${H}Z" fill="var(--cyan)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--cyan)" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="var(--cyan)"/></svg>`;
}

const RealSerial = {
  port: null, reader: null, writer: null, keep: false,
  available() { return !!(window.EV_STANDALONE && 'serial' in navigator); },
  async connect(baud) {
    try {
      Ard.stop(true);
      this.port = await navigator.serial.requestPort();
      await this.port.open({ baudRate: baud });
      Ard.real = this; Ard.setStatus('real'); Ard.log('s', 'Placa real conectada a ' + baud + ' baudios. Las líneas que envíe aparecen aquí y en el plotter.');
      this.keep = true; this.readLoop(); this.render();
    } catch (e) {
      this.port = null;
      if (e && e.name === 'NotFoundError') return;
      toast('No se pudo abrir el puerto: ' + (e && e.message || e) + '. Cierra el Arduino IDE si lo tienes abierto.', 'bad', 7000);
    }
  },
  async readLoop() {
    const dec = new TextDecoder();
    while (this.port && this.port.readable && this.keep) {
      this.reader = this.port.readable.getReader();
      try { for (;;) { const { value, done } = await this.reader.read(); if (done) break; if (value) Ard.addSerial(dec.decode(value, { stream: true })); } }
      catch (e) { Ard.log('w', 'Lectura interrumpida: ' + e.message); break; }
      finally { try { this.reader.releaseLock(); } catch (e) { } }
    }
  },
  async write(text) { if (!this.port || !this.port.writable) return; const w = this.port.writable.getWriter(); try { await w.write(new TextEncoder().encode(text)); } finally { w.releaseLock(); } },
  async disconnect() {
    this.keep = false;
    try { if (this.reader) await this.reader.cancel(); } catch (e) { }
    try { if (this.port) await this.port.close(); } catch (e) { }
    this.port = null; Ard.real = null; Ard.setStatus('detenido'); Ard.log('s', 'Placa real desconectada.'); this.render();
  },
  render() {
    const box = $('#real'); if (!box) return;
    if (!this.available()) {
      box.innerHTML = `<p class="small muted">${window.EV_STANDALONE ? 'Este navegador no tiene Web Serial. Usa Google Chrome o Microsoft Edge en una computadora.' : 'Conectar una placa real por USB funciona en la versión instalable (GitHub Pages) con Chrome o Edge. Dentro de Claude el navegador lo bloquea por seguridad.'}</p>`;
      return;
    }
    box.innerHTML = this.port
      ? `<p class="small"><b style="color:var(--ok)">Conectada.</b> Lo que imprima tu placa con Serial.println() se ve en el monitor y el plotter.</p><button class="btn sm danger" id="rs-off">Desconectar</button>`
      : `<p class="small muted">Sube tu programa con el Arduino IDE, ciérralo y conecta aquí la placa para ver sus datos reales.</p>
         <div class="row"><label class="sr" for="rs-baud">Velocidad</label><select class="input sm" id="rs-baud" style="width:auto">${[9600, 19200, 57600, 115200].map(b => `<option ${b === 9600 ? 'selected' : ''}>${b}</option>`).join('')}</select><button class="btn sm primary" id="rs-on">${ic('chip')} Conectar placa USB</button></div>`;
    if ($('#rs-on')) $('#rs-on').onclick = () => this.connect(+$('#rs-baud').value);
    if ($('#rs-off')) $('#rs-off').onclick = () => this.disconnect();
  }
};

      A.worker.postMessage({ type: 'serialIn', text: v + '\n' }); A.log('s', '> ' + v); $('#serial-in').value = '';
    };
    $('#serial-clear').onclick = () => { A.serial = []; A.plot = []; A.renderSerial(); A.drawPlot(); };
    $('#iot-form').onsubmit = e => { e.preventDefault(); const t = $('#iot-t').value.trim(), p = $('#iot-p').value; if (!t) { toast('Escribe el tema, por ejemplo casa/luz.', 'warn'); return; } if (/[#+]/.test(t)) { toast('Para publicar, el tema no puede llevar # ni +.', 'warn'); return; } Iot.publish(t, p, 'panel'); };
    $('#iot-share').onchange = e => Iot.share(e.target.checked);
    A.renderCode(); A.renderErrors(); A.renderLeds(); A.renderInputs(); A.renderMods(); A.renderSerial(); A.setStatus(A.real && A.real.port ? 'real' : A.status); A.renderBoardStatus();
    Iot.draw(); RealSerial.render();
    if (A.autorun) { A.autorun = false; A.run(); }
  },
  leave() { /* el programa sigue corriendo en segundo plano, como una placa real conectada */ }
};

          $('#quiz-score').textContent = score + '/' + l.quiz.length + (passed ? ' · lección completada' : ' · necesitas 2 de 3, repasa e inténtalo otra vez');
          if (passed && !prev.done) { State.profile.lessons[l.id] = { done: true, score, ts: Date.now() }; addXP(30 + score * 10, 'Lección completada'); }

          const r = $('#quiz-retry'); if (r) r.onclick = () => route();
          const d = lessonsDone(); if (d >= 3) award('estudioso'); if (d >= LESSONS.length) award('maestro-ohm');
        }
      });
    });
  },
  leave() { Viz.stop(); }
};

/* ---------- Visualizaciones de lecciones ---------- */
const Viz = {
  raf: 0,
  stop() { cancelAnimationFrame(this.raf); },
  canvas(box, h = 220) { const c = document.createElement('canvas'); c.className = 'viz'; c.style.height = h + 'px'; box.appendChild(c); return c; },
  prep(c) { const dpr = Math.min(2, devicePixelRatio || 1), w = c.clientWidth, h = c.clientHeight; if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; } const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); return [x, w, h]; },
  col(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); },
  slider(box, id, label, min, max, step, val, unit) {
    box.insertAdjacentHTML('beforeend', `<div class="field"><label for="${id}">${label}: <span class="mono" id="${id}-v"></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`);
    return $('#' + id);
  },
  mount(kind, box) {
    this.stop(); box.innerHTML = '';
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.getAttribute('data-motion') === 'reduce';
    if (kind === 'electrones' || kind === 'ohm') {
      const c = this.canvas(box);
      const sv = this.slider(box, 'vz-v', 'Voltaje', 0, 12, 0.5, 6), sr = this.slider(box, 'vz-r', 'Resistencia', 100, 2000, 50, 1000);
      const out = document.createElement('div'); out.className = 'formula'; box.appendChild(out);
      const dots = Array.from({ length: 70 }, (_, i) => ({ p: i / 70, lane: Math.random() }));
      const draw = () => {
        if (!c.isConnected) return;
        const V = +sv.value, R = +sr.value, I = V / R;
        $('#vz-v-v').textContent = V.toFixed(1).replace('.', ',') + ' V'; $('#vz-r-v').textContent = R + ' Ω';
        out.innerHTML = `I = V / R = ${V.toFixed(1).replace('.', ',')} V / ${R} Ω = <b style="color:var(--amber)">${fmt(I, 'A')}</b> · P = ${fmt(V * I, 'W')}`;
        const [x, w, h] = this.prep(c); x.clearRect(0, 0, w, h);
        const pad = 30, top = 50, bot = h - 40;
        x.strokeStyle = this.col('--line-2'); x.lineWidth = 16; x.lineJoin = 'round'; x.strokeRect(pad, top, w - pad * 2, bot - top);
        // batería
        x.fillStyle = this.col('--bg'); x.fillRect(pad - 14, (top + bot) / 2 - 22, 28, 44);
        x.strokeStyle = this.col('--magenta'); x.lineWidth = 3; x.beginPath(); x.moveTo(pad - 12, (top + bot) / 2 - 6); x.lineTo(pad + 12, (top + bot) / 2 - 6); x.stroke();
        x.lineWidth = 6; x.beginPath(); x.moveTo(pad - 6, (top + bot) / 2 + 6); x.lineTo(pad + 6, (top + bot) / 2 + 6); x.stroke();
        // resistencia (grosor visual según R)
        const rw = 60, rx = w / 2 - rw / 2; x.fillStyle = this.col('--bg'); x.fillRect(rx, top - 12, rw, 24);
        x.strokeStyle = this.col('--amber'); x.lineWidth = 2; x.beginPath(); x.moveTo(rx, top);
        for (let k = 0; k <= 6; k++) x.lineTo(rx + k * rw / 6, top + (k % 2 ? -9 : 9) * (k === 0 || k === 6 ? 0 : 1)); x.stroke();
        x.fillStyle = this.col('--muted'); x.font = '12px ' + this.col('--f-mono'); x.fillText(R + ' Ω', rx + 8, top - 18);
        // electrones
        const per = 2 * (w - pad * 2) + 2 * (bot - top);
        const speed = reduce ? 0 : I * 0.06;
        dots.forEach(d => { d.p = (d.p - speed + 1) % 1; });
        x.fillStyle = this.col('--cyan');
        dots.forEach(d => {
          let s = d.p * per, X, Y; const W = w - pad * 2, H = bot - top, o = (d.lane - .5) * 8;
          if (s < W) { X = pad + s; Y = top + o; } else if ((s -= W) < H) { X = w - pad + o; Y = top + s; } else if ((s -= H) < W) { X = w - pad - s; Y = bot + o; } else { s -= W; X = pad + o; Y = bot - s; }
          x.beginPath(); x.arc(X, Y, 2.6, 0, 7); x.fill();
        });
        x.fillStyle = this.col('--muted'); x.fillText('electrones (puntos celestes) · más voltaje o menos resistencia = más corriente', pad, h - 12);
        this.raf = requestAnimationFrame(draw);
      };
      draw(); return;
    }
    if (kind === 'led') {
      box.insertAdjacentHTML('beforeend', `<div class="grid g2" style="gap:10px">
        <div class="field"><label for="ld-vs">Voltaje de la fuente (V)</label><input class="input mono" id="ld-vs" type="number" step="0.1" min="1" value="5"></div>
        <div class="field"><label for="ld-c">Color del LED</label><select class="input" id="ld-c">${['rojo', 'amarillo', 'verde', 'azul', 'blanco'].map(k => `<option value="${k}">${k} (≈${EVEngine.DIODES[k].vf.toFixed(1).replace('.', ',')} V)</option>`).join('')}</select></div>
        <div class="field"><label for="ld-i">Corriente deseada (mA)</label><input class="input mono" id="ld-i" type="number" step="1" min="1" max="30" value="15"></div></div>
        <div id="ld-out" class="dmm-screen" aria-live="polite"></div><svg id="ld-svg" viewBox="0 0 300 90" style="width:100%;height:auto"></svg>`);
      const calc = () => {
        const vs = +$('#ld-vs').value, c = $('#ld-c').value, i = +$('#ld-i').value / 1000, vf = EVEngine.DIODES[c].vf;
        const out = $('#ld-out');

        const R = (vs - vf) / i; let dec = Math.pow(10, Math.floor(Math.log10(R))), com = null;
        for (const m of E12.concat([10])) { if (m * dec >= R - 1e-9) { com = m * dec; break; } }
        const ireal = (vs - vf) / com, P = ireal * ireal * com, pw = [0.125, 0.25, 0.5, 1, 2].find(w => w >= P * 2) || 5;
        out.innerHTML = `<div class="big">${fmt(com, 'Ω')}</div><div class="sub"><span>Calculada</span><b>${fmt(R, 'Ω')}</b><span>Corriente real</span><b>${fmt(ireal, 'A')}</b><span>Potencia en R</span><b>${fmt(P, 'W')} → usa ${fmt(pw, 'W')}</b></div>`;
        const col = EVEngine.DIODES[c].color, k = clamp(ireal / 0.02, 0.1, 1);
        $('#ld-svg').innerHTML = `<path d="M10 45H90M150 45H190M230 45H290" stroke="var(--muted)" stroke-width="3"/><path d="M90 45l5-10 10 20 10-20 10 20 10-20 5 10" fill="none" stroke="var(--amber)" stroke-width="2.5"/><text x="96" y="78" fill="var(--muted)" style="font:11px monospace">${fmt(com, 'Ω')}</text><circle cx="210" cy="45" r="${18 + 10 * k}" fill="${col}" opacity="${0.25 * k}"/><path d="M200 33V57L222 45Z" fill="${col}" stroke="var(--fg)"/><path d="M222 33V57" stroke="var(--fg)" stroke-width="2.5"/>`;
      };

    }
    if (kind === 'rc') {
      const c = this.canvas(box);
      const sr = this.slider(box, 'rc-r', 'Resistencia', 1, 100, 1, 10), sc = this.slider(box, 'rc-c', 'Capacidad', 10, 1000, 10, 100);
      const out = document.createElement('div'); out.className = 'formula'; box.appendChild(out);
      const draw = () => {
        if (!c.isConnected) return;
        const R = +sr.value * 1000, C = +sc.value * 1e-6, tau = R * C, tmax = Math.max(5 * tau, 0.001);

        out.innerHTML = `τ = R·C = <b style="color:var(--amber)">${fmt(tau, 's')}</b> · carga completa (5τ) ≈ ${fmt(5 * tau, 's')}`;
        const [x, w, h] = this.prep(c); x.clearRect(0, 0, w, h);
        const L = 40, B = h - 28, T = 16, Wd = w - L - 12;
        x.strokeStyle = this.col('--line'); x.lineWidth = 1;
        for (let k = 0; k <= 5; k++) { const X = L + k / 5 * Wd; x.beginPath(); x.moveTo(X, T); x.lineTo(X, B); x.stroke(); x.fillStyle = this.col('--muted'); x.font = '11px ' + this.col('--f-mono'); x.fillText(k + 'τ', X - 6, h - 10); }
        x.fillText('9 V', 4, T + 4); x.fillText('0', 20, B);
        x.strokeStyle = this.col('--amber'); x.lineWidth = 2.5; x.beginPath();
        for (let k = 0; k <= 200; k++) { const t = k / 200 * tmax, v = 1 - Math.exp(-t / tau); const X = L + t / tmax * Wd, Y = B - v * (B - T); k ? x.lineTo(X, Y) : x.moveTo(X, Y); }
        x.stroke();
        const Y63 = B - 0.632 * (B - T), X1 = L + Wd / 5;
        x.setLineDash([4, 4]); x.strokeStyle = this.col('--cyan'); x.beginPath(); x.moveTo(L, Y63); x.lineTo(X1, Y63); x.lineTo(X1, B); x.stroke(); x.setLineDash([]);
        x.fillStyle = this.col('--cyan'); x.fillText('63,2 % = 5,69 V', X1 + 6, Y63 - 4);

    }

    }

        x.fillStyle = this.col('--muted'); x.font = '11px ' + this.col('--f-mono'); x.fillText('HC-SR04', 14, cy + 44);
        x.fillStyle = this.col('--line-2'); x.fillRect(wallX, 20, 14, h - 40);
        const period = 1600, ph = reduce ? 0.25 : ((now % period) / period);
        const going = ph < 0.5, k = going ? ph * 2 : (1 - ph) * 2, wx = 72 + (wallX - 72) * k;
        x.strokeStyle = going ? this.col('--cyan') : this.col('--amber'); x.lineWidth = 2.5;
        for (let i = 0; i < 3; i++) { x.globalAlpha = 1 - i * 0.3; x.beginPath(); x.arc(going ? wx - i * 10 : wx + i * 10, cy, 18 + i * 4, going ? -0.6 : Math.PI - 0.6, going ? 0.6 : Math.PI + 0.6); x.stroke(); }
        x.globalAlpha = 1;

      const ms = this.slider(box, 'bl-ms', 'Tiempo de delay()', 100, 1500, 50, 500);

};

  offline(kind) {

        const r = L.res && L.res[p.id]; if (!r) return; const d = EVEngine.DIODES[p.color];

          const vs = src ? +src.v : 5, R = (vs - d.vf) / 0.015;
          let dec = Math.pow(10, Math.floor(Math.log10(Math.max(R, 1)))), com = E12.map(m => m * dec).concat([10 * dec]).find(v => v >= R);
          tips.push(`**${p.id} se quema o está al límite** (${fmt(Math.abs(r.i), 'A')}; máximo ${fmt(d.imax, 'A')}). Pon una resistencia en serie: R = (${vs} − ${d.vf}) / 0,015 A ≈ ${fmt(R, 'Ω')} → usa **${fmt(com, 'Ω')}**. Luego pulsa Reiniciar.`);
        } else if (r.v < -0.5) tips.push(`**${p.id} está al revés**: su ánodo (+) debe ir hacia el positivo de la batería. Bórralo y colócalo en sentido contrario.`);
        else if (Math.abs(r.i) < 1e-4) tips.push(`**${p.id} no enciende**: casi no circula corriente (${fmt(Math.abs(r.i), 'A')}). Revisa que el circuito esté cerrado y que la fuente supere ${d.vf} V.`);
        else tips.push(`${p.id} funciona bien: ${fmt(Math.abs(r.i), 'A')} con ${fmt(r.v, 'V')} en sus terminales.`);
      });
      L.parts.filter(p => p.t === 'R').forEach(p => { const r = L.res && L.res[p.id]; if (r && r.burned) tips.push(`**${p.id} se quemó**: disipó más de ${fmt(+p.w || 0.25, 'W')}. P = V²/R; usa una resistencia mayor o de más vatios.`); });
      if (L.parts.some(p => p.t === 'C') && L.parts.some(p => p.t === 'R')) { const r = L.parts.find(p => p.t === 'R'), c = L.parts.find(p => p.t === 'C'); tips.push(`Dato: con ${r.id} y ${c.id}, τ = R·C ≈ ${fmt(r.v * c.v, 's')}. Usa ▶ Ejecutar y el osciloscopio para ver la carga.`); }
      if (!tips.length) tips.push('No detecto errores: el circuito está cerrado y referenciado a tierra. Usa el multímetro para comprobar con la teoría.');
    } else if (kind === 'codigo') {
      const code = Ard.code || ''; const c = EVEngine.compileArduino(code);
      if (!c.ok) c.errors.forEach(e => tips.push('**' + (e.line ? 'Línea ' + e.line : 'Programa') + ':** ' + e.msg));
      const pm = /pinMode\s*\(/.test(code), dw = /digitalWrite\s*\(/.test(code);
      if (dw && !pm) tips.push('Usas **digitalWrite** pero no configuras el pin con **pinMode(pin, OUTPUT)** en setup().');

      if (/void\s+loop[\s\S]*\{\s*\}/.test(code)) tips.push('Tu loop() está vacío: la placa no hará nada después de setup().');

const Codes = {
  gen() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; const r = crypto.getRandomValues(new Uint8Array(6)); r.forEach(b => s += A[b % A.length]); return s; },
  hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).slice(0, 4).toUpperCase(); },
  encode(o) { const j = JSON.stringify(o); const b = btoa(unescape(encodeURIComponent(j))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); return 'EV1-' + b + '-' + this.hash(b); },
  decode(s) {
    const m = String(s).trim().match(/^EV1-([A-Za-z0-9_-]+)-([A-Z0-9]{1,4})$/); if (!m) throw new Error('El código no tiene el formato EV1-…');
    if (this.hash(m[1]) !== m[2]) throw new Error('El código está incompleto o fue modificado (no coincide la verificación).');
    const b = m[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(b))));

/* ---------- v13 · Biblioteca de componentes ----------
   Lee todo desde window.EV_DATA (archivo data/componentes.js).
   No toca los catálogos del simulador: es una sección nueva de consulta. */
const Biblio = {
  cat: '', q: '', sel: null, tabCon: 'arduino', tabCod: 'arduino',
  datos() { return window.EV_DATA || null; },
  colorTipo(t) { const D = this.datos(); return (D && D.tiposPin[t]) || '#9aa7cc'; },
  // Quita tildes y pasa a minúsculas para que la búsqueda sea flexible
  norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); },
  // Adivina el tipo de un pin por su nombre (para pintar los conectores de las placas)
  tipoPorNombre(n) {
    const s = String(n).toUpperCase();
    if (/GND/.test(s)) return 'GND';
    if (/^(5V|3V3|3\.3V|VIN|VCC|IOREF)/.test(s)) return 'alimentación';
    if (/SDA|SCL/.test(s)) return 'I2C';
    if (/TX|RX|U0R|U0T/.test(s)) return 'UART';
    if (/~/.test(s)) return 'PWM';
    if (/^A\d|^VP|^VN|^3[4-9]\b/.test(s)) return 'analógico';
    if (/^SD[0-3]|^CMD|^CLK|^NC|^EN|RST|RESET|AREF/.test(s)) return 'otro';
    return 'digital';
  },
  /* Busca el tipo real de un pin del conector en la lista de pines de la placa.
     ESP32: compara el número de GPIO · Arduino: compara el nombre (D11, A4, 5V…) */
  buscarPin(c, etiqueta) {
    const nums = s => (String(s).match(/\b\d+\b/g) || []).concat((String(s).match(/^IO(\d+)/) || []).slice(1));
    if (/^esp32/.test(c.id)) {
      const n = nums(etiqueta)[0];
      const p = n != null && c.pines.find(x => nums(x.nombre).includes(n));
      if (p) return p;
    }
    const token = String(etiqueta).split(' ')[0].replace(/[^\w.]/g, '');
    if (!token) return null;
    const re = new RegExp('(^|[^\\w.])' + token.replace('.', '\\.') + '($|[^\\w.])');
    return c.pines.find(x => re.test(x.nombre)) || null;
  },
  tipoEnPlaca(c, etiqueta) {
    if (/~/.test(etiqueta)) return 'PWM';
    const p = this.buscarPin(c, etiqueta);
    return p ? p.tipo : this.tipoPorNombre(etiqueta);
  },
  DESC_TIPO: { 'alimentación': 'Pin de alimentación', 'GND': 'Tierra (0 V)', 'digital': 'Entrada/salida digital', 'analógico': 'Entrada analógica', 'PWM': 'Salida con PWM (brillo o velocidad variable)', 'I2C': 'Bus I2C', 'SPI': 'Bus SPI', 'UART': 'Puerto serie', 'otro': '' },
  // Tipo y función de un pin a partir de su etiqueta (lo usa también el visor 3D)
  infoPin(c, etiqueta) {
    const p = this.buscarPin(c, etiqueta), tipo = this.tipoEnPlaca(c, etiqueta);
    return { tipo, funcion: (p && p.funcion) || this.DESC_TIPO[tipo] || '' };
  },
  ayuda3D() { return { infoPin: (c, e) => this.infoPin(c, e), color: t => this.colorTipo(t) }; },
  catNombre(id) { const D = this.datos(); const k = D && D.categorias.find(x => x.id === id); return k ? k.nombre : id; },
  filtrados() {
    const D = this.datos(), q = this.norm(this.q);
    return D.componentes.filter(c => (!this.cat || c.categoria === this.cat) && (!q || this.norm(c.nombre + ' ' + c.id + ' ' + c.descripcion).includes(q)));
  },
  tipoChip(t) { return `<span class="bib-tipo" style="--c:${this.colorTipo(t)}">${esc(t)}</span>`; },

  /* Dibujo del chip DIP visto desde arriba, con sus compuertas internas */
  dipSVG(c) {
    const n = c.pines.length, mitad = n / 2, paso = 34, bx = 90, bw = 240, by = 24, bh = mitad * paso + 12, W = 420, H = bh + by * 2, gw = 64;
    const yDe = p => by + 23 + (p <= mitad ? p - 1 : n - p) * paso;   // altura de cada pin
    const nombre = p => (c.pines[p - 1].nombre.split(' · ')[1] || c.pines[p - 1].nombre);
    let s = `<svg class="bib-dip" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribución de pines del ${esc(c.nombre)}">`;
    s += `<rect class="cuerpo" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6"/><path d="M${bx + bw / 2 - 13} ${by}a13 13 0 0 0 26 0" fill="#0b0c0e"/>`;
    for (let p = 1; p <= n; p++) {
      const izq = p <= mitad, y = yDe(p), t = c.pines[p - 1].tipo, cls = t === 'alimentación' ? 'pata vcc' : t === 'GND' ? 'pata gnd' : 'pata';
      s += `<rect class="${cls}" x="${izq ? bx - 18 : bx + bw}" y="${y - 6}" width="18" height="12" rx="2"/>`;
      s += `<text class="num" x="${izq ? bx + 8 : bx + bw - 8}" y="${y + 4}" text-anchor="${izq ? 'start' : 'end'}">${p}</text>`;
      s += `<text class="nom" x="${izq ? bx - 24 : bx + bw + 24}" y="${y + 4}" text-anchor="${izq ? 'end' : 'start'}">${esc(nombre(p))}</text>`;
    }
    if (c.compuertas && c.compuertas.length) {
      c.compuertas.forEach(g => {
        const pins = g.entradas.concat([g.salida]), izq = g.salida <= mitad, ys = pins.map(yDe);
        const x0 = izq ? bx + 40 : bx + bw - 40 - gw, y0 = Math.min(...ys) - 12, y1 = Math.max(...ys) + 12;
        pins.forEach((p, i) => {
          const y = yDe(p), sal = i === pins.length - 1;
          s += `<path class="cable${sal ? ' sal' : ''}" d="M${izq ? bx : bx + bw} ${y}H${izq ? x0 : x0 + gw}"/>`;
        });
        s += `<rect class="compuerta" x="${x0}" y="${y0}" width="${gw}" height="${y1 - y0}" rx="8"/><text class="ctxt" x="${x0 + gw / 2}" y="${(y0 + y1) / 2 + 4}" text-anchor="middle">${esc(g.tipo)}</text>`;
      });
    } else if (c.bloque) {
      const palabras = c.bloque.split(' '), lineas = [];
      palabras.forEach(w => { const l = lineas[lineas.length - 1]; if (l && (l + ' ' + w).length <= 16) lineas[lineas.length - 1] = l + ' ' + w; else lineas.push(w); });
      const cy = by + bh / 2 - (lineas.length - 1) * 8;
      s += `<rect class="bloque" x="${bx + 40}" y="${by + 26}" width="${bw - 80}" height="${bh - 52}" rx="10"/>`;
      lineas.forEach((l, i) => { s += `<text class="btxt" x="${bx + bw / 2}" y="${cy + i * 16 + 4}" text-anchor="middle">${esc(l)}</text>`; });
    }
    return s + '</svg>';
  },

  /* Conectores de la placa o hilera de pines del módulo */
  pinout(c) {
    if (c.categoria === 'ci') {
      return this.dipSVG(c) + (c.compuertas ? '<p class="small muted" style="text-align:center">Vista desde arriba · la muesca marca el lado del pin 1 · <span style="color:var(--cyan)">cian = entradas</span> · <span style="color:var(--lime)">verde = salida</span></p>' : '<p class="small muted" style="text-align:center">Vista desde arriba · la muesca marca el lado del pin 1</p>');
    }
    if (c.encabezados) {
      return `<div class="bib-lados">${Object.entries(c.encabezados).map(([lado, pins]) => `<div><div class="lbl" style="margin-bottom:6px">${esc(lado)}</div><div class="bib-pins">${pins.map(p => `<span class="bib-pin" style="--c:${this.colorTipo(this.tipoEnPlaca(c, p))}">${esc(p)}</span>`).join('')}</div></div>`).join('')}</div>`;
    }
    return `<div class="bib-pins">${c.pines.map(p => `<span class="bib-pin" style="--c:${this.colorTipo(p.tipo)}" title="${esc(p.funcion)}">${esc(p.nombre)}</span>`).join('')}</div>`;
  }
};

        <p>Pines, conexiones, código de ejemplo y cuidados de cada placa, sensor, módulo y circuito integrado.</p></div></div>

          ${c.compatibleCon.map(p => `<span class="badge ok">${esc(p)}</span>`).join('')}

  // La pestaña elegida por el estudiante se respeta; si esta ficha no la tiene, se muestra la otra (sin olvidar la elección)
  panelConexion(c) {

  },
  panelCodigo(c) {
    const B = Biblio;
    const tab = B.tabCod === 'esp32' ? (c.codigoESP32 ? 'esp32' : 'arduino') : (c.codigoArduino ? 'arduino' : 'esp32');
    B.codVisible = tab;
    const codigo = tab === 'esp32' ? c.codigoESP32 : c.codigoArduino;
    if (!codigo) return '';
    return `<div class="panel bib-code"><div class="panel-h"><h3>Código de ejemplo</h3>
      <div class="seg" role="group" aria-label="Placa del código">${c.codigoArduino ? `<button data-tabcod="arduino" aria-pressed="${tab === 'arduino'}">Arduino</button>` : ''}${c.codigoESP32 ? `<button data-tabcod="esp32" aria-pressed="${tab === 'esp32'}">ESP32</button>` : ''}</div></div>
      <div class="panel-b"><pre class="mono"><code>${highlight(codigo)}</code></pre>
        <div class="row bib-acciones"><button class="btn sm" id="bib-copiar">${ic('copy')} Copiar código</button><button class="btn sm primary" id="bib-probar">${ic('play')} Probar en el simulador</button></div>
      </div></div>`;
  },
  leave() { if (window.Visor3D) Visor3D.desmontar(); },

  mount() {
    if (!Biblio.datos()) return;
    $('#bib-q').oninput = e => { Biblio.q = e.target.value; this.lista(); };
    $$('.bib-cats [data-cat]').forEach(b => b.onclick = () => {
      Biblio.cat = b.dataset.cat;

  // Cambia de ficha sin recargar toda la sección (replaceState no dispara "hashchange")
  abrir(id) {
    const c = Biblio.datos().buscar(id); if (!c) return;
    if (!$('#bib-ficha')) { go('biblioteca-' + encodeURIComponent(id)); return; }   // si la sección no está abierta, se abre
    Biblio.sel = id;
    history.replaceState(null, '', '#biblioteca-' + encodeURIComponent(id));
    $('#bib-ficha').innerHTML = this.ficha(c);
    $('#bib').classList.add('con-ficha');
    $$('#bib-items [data-id]').forEach(b => b.setAttribute('aria-current', b.dataset.id === id));
    if (matchMedia('(max-width: 900px)').matches) $('#main').scrollTop = 0;
    this.enlazar();
  },
  enlazar() {
    const c = Biblio.sel && Biblio.datos().buscar(Biblio.sel); if (!c) return;
    const volver = $('#bib-volver');
    if (volver) volver.onclick = () => { if (window.Visor3D) Visor3D.desmontar(); Biblio.sel = null; history.replaceState(null, '', '#biblioteca'); $('#bib').classList.remove('con-ficha'); $('#bib-ficha').innerHTML = this.vacio(); this.lista(); };

    const v3 = $('#v3b');

/* ===== Arranque y manejo global de errores ===== */
window.addEventListener('error', e => {
  if (!e.message || /ResizeObserver|Script error/.test(e.message)) return;
  console.error(e.error || e.message);
  toast('Algo falló (' + e.message + '). La aplicación sigue funcionando; si se repite, recarga la página.', 'bad', 7000);
});
window.addEventListener('unhandledrejection', e => {
  const r = e.reason; console.error(r);
  if (r && (r.name === 'AbortError' || r.code === 'aborted')) return;
  toast('Una operación no terminó: ' + ((r && (r.message || r.code)) || 'error desconocido') + '.', 'warn', 6000);
});
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installPrompt = e;
  const b = $('#installbtn'); if (b) b.hidden = false;
});
window.addEventListener('appinstalled', () => { installPrompt = null; const b = $('#installbtn'); if (b) b.hidden = true; toast('Electroverse quedó instalada. Ábrela desde el escritorio o el menú de aplicaciones, incluso sin internet.', 'ok', 7000); });
document.addEventListener('click', async e => {
  if (!e.target.closest || !e.target.closest('#installbtn') || !installPrompt) return;
  installPrompt.prompt(); try { await installPrompt.userChoice; } catch (x) { } installPrompt = null; $('#installbtn').hidden = true;
});
function registerSW() {
  if (!window.EV_STANDALONE || !('serviceWorker' in navigator) || !/^https?:/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Hay una versión nueva de Electroverse. Recarga la página para usarla.', 'ok', 9000); });
    });
  }).catch(err => console.warn('SW', err));
}
(async function boot() {
  Prefs.apply(); Luz.apply();
  $('#gate').innerHTML = `<div class="panel gate-card" style="align-items:center;text-align:center"><div class="gate-logo">${LOGO}</div><h2>Electroverse</h2><p class="muted">${window.EV_STANDALONE ? 'Preparando el laboratorio…' : 'Conectando con tu cuenta…'}</p></div>`;
  registerSW();
  await Store.init();
  const mode = Store.gget('mode', null);
  if (mode && mode.startsWith('local:')) Store.useLocal(mode.slice(6));
  else if (mode === 'invitado') Store.useLocal('invitado');
  else if (!Store.uid) Store.localId = null;
  State.profile = Object.assign(State.defaults(), Store.lget('perfil', {}));
  if (Store.profileRef()) {
    const cloud = await Store.loadCloudProfile();
    if (cloud && (cloud.updated || 0) > (State.profile.updated || 0)) { State.profile = Object.assign(State.defaults(), cloud); Store.lset('perfil', State.profile); }
    else if (State.profile.updated) Store.pushProfile(State.profile);
  }
  const resumable = Store.gget('session', false) && State.profile.rol && State.profile.consent && (Store.uid || Store.localId);
  if (resumable) { $('#gate').hidden = true; startApp(); }
  else showGate();
  window.addEventListener('online', () => { renderCloudChip(); if (Store.pendingSync) Store.pushProfile(State.profile); });
  window.addEventListener('offline', () => { renderCloudChip(); });
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { Lab.colorsDirty = true; renderThemeBtn(); if (currentView === 'lab') Lab.renderAll(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && Lab.running) Lab.pause(); });
})();
